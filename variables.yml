# APG variables (see https://docs.platform.cyberrange.cz/user-guide-advanced/sandboxes/apg-variables/)
#
# The platform generates a DIFFERENT random value of every variable below for every
# sandbox, stores it as the correct answer of the matching training level
# (training.json -> "answer_variable_name") and passes it to Ansible as an extra variable.
#
# Type "password" = random letters + digits of the given length.
# Each value is the secret flag of one task. It is never written in clear text on the VM:
# provisioning only stores it encrypted with a key that the student can obtain only by
# solving the task with his own (per-sandbox) RSA numbers.

flag_task1:
  type: password
  length: 10

flag_task2:
  type: password
  length: 10

flag_task3:
  type: password
  length: 10

flag_task4:
  type: password
  length: 10

flag_task5:
  type: password
  length: 10

flag_task6:
  type: password
  length: 10
